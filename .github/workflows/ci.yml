name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (CPU torch, no GPU-only packages)
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            torch diffusers transformers accelerate peft safetensors fastapi httpx pillow numpy pytest ruff
      - name: Lint
        run: ruff check .
      - name: Tests (CPU, no model weights)
        run: python -m pytest -q server/tests lam/tests/test_swap.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Typecheck
        run: npx next typegen && npx tsc --noEmit
      - run: npm run build
